# Bump the version in package.json, create a tagged commit, and push.
# The tag push triggers the corresponding release workflow (publish.yml
# for stable, publish-beta.yml for beta).
name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type'
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      preid:
        description: 'Pre-release identifier (e.g. beta). When set, bumps the prerelease segment instead of the main version.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          PREID: ${{ inputs.preid }}
        run: |
          if [ -n "$PREID" ]; then
            npm version prerelease --preid="$PREID" -m "Release v%s"
          else
            npm version ${{ inputs.bump }} -m "Release v%s"
          fi
          echo "new_tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push --follow-tags origin main
